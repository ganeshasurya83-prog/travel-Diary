<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout concept: India Post red rail on desktop, red top bar and tab bar on phones; white working surface with a gold postal accent. */
:root{
  --bg:#f4f2f2; --surface:#ffffff; --surface-2:#f8f5f5; --ink:#201a1a; --muted:#6d6363; --line:#e6e0e0;
  --brand:#c8201a; --brand-ink:#ffffff; --gold:#ffc72c;
  --accent:#d1281f; --accent-ink:#ffffff; --accent-soft:#fde9e7; --bar:#f3bcb7;
  --money:#8f5a00; --money-soft:#fff1c7; --danger:#b3342b; --danger-soft:#fbe6e4; --ok:#1e7a4d; --ok-soft:#e1f3e8;
  --shadow:0 1px 2px rgba(32,26,26,.06),0 6px 20px rgba(32,26,26,.07);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161111; --surface:#211a1a; --surface-2:#2a2121; --ink:#f5eeee; --muted:#b4a6a6; --line:#3a2e2e;
  --brand:#8f1712; --brand-ink:#ffffff; --gold:#ffc72c;
  --accent:#ff6a5e; --accent-ink:#2b0402; --accent-soft:#3d1b18; --bar:#5e2b27;
  --money:#ffcf5c; --money-soft:#3a2d0c; --danger:#ff8f86; --danger-soft:#3b1d1b; --ok:#59d197; --ok-soft:#143323;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161111; --surface:#211a1a; --surface-2:#2a2121; --ink:#f5eeee; --muted:#b4a6a6; --line:#3a2e2e;
  --brand:#8f1712; --brand-ink:#ffffff; --gold:#ffc72c;
  --accent:#ff6a5e; --accent-ink:#2b0402; --accent-soft:#3d1b18; --bar:#5e2b27;
  --money:#ffcf5c; --money-soft:#3a2d0c; --danger:#ff8f86; --danger-soft:#3b1d1b; --ok:#59d197; --ok-soft:#143323;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:6px;background:var(--brand);color:var(--brand-ink)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:10px;background:var(--gold);color:var(--brand);display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:none;color:rgba(255,255,255,.78);font-weight:600;text-align:left}
.nav:hover{background:rgba(255,255,255,.1);color:#fff}
.nav[aria-current="page"]{background:rgba(255,255,255,.18);color:#fff}
.nav[aria-current="page"] svg{color:var(--gold)}
.nav svg,.mark svg{width:20px;height:20px;flex:none}
.addbtn{margin:14px 0 6px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border:0;border-radius:12px;background:var(--gold);color:#3b0a07;font-weight:700}
.addbtn:hover{filter:brightness(1.07)}
.addbtn svg{width:18px;height:18px}
.status{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:rgba(255,255,255,.85)}
.status i{width:8px;height:8px;border-radius:50%;background:#7be3a8;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.status[data-s="pending"] i,.status[data-s="saving"] i{background:var(--gold)}
.status[data-s="error"] i,.status[data-s="readonly"] i{background:#fff}
.status button{border:0;background:none;color:var(--gold);font-weight:700;padding:0;text-decoration:underline}

.main{min-width:0;padding:28px 32px 48px;max-width:1120px;width:100%}
.topbar{display:none}
.tabbar{display:none}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{font-size:30px;line-height:1.1}
.pagehead p{margin:4px 0 0;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pad{padding:22px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper button svg{width:18px;height:18px}
.stepper b{min-width:150px;text-align:center;font-family:var(--display);font-size:18px}

.hero{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:28px;align-items:stretch}
.bigfare small,.fig small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bigfare strong{display:block;font-family:var(--display);font-size:56px;line-height:1.05;letter-spacing:-.03em;margin:6px 0 2px;color:var(--money)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.fig{padding-top:12px;border-top:1px solid var(--line)}
.fig b{display:block;font-family:var(--display);font-size:24px;margin-top:2px}
.fig span{color:var(--muted);font-size:13px}
.chartwrap{min-width:0}
.chartwrap h3{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:600;margin-bottom:6px}
svg.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--bar)}
.chart g[data-act]{cursor:pointer}
.chart g[data-act]:hover .bar{fill:var(--accent);opacity:.6}
.chart .sel .bar{fill:var(--accent)}
.chart .sel text{fill:var(--ink);font-weight:700}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
.cols h2{font-size:18px;margin-bottom:14px}
.places{display:flex;flex-direction:column;gap:12px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.pl span{overflow-wrap:anywhere}
.pl em{font-style:normal;color:var(--muted)}
.pl div{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pl div i{display:block;height:100%;background:var(--accent);border-radius:3px}

.trip{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:6px 14px;align-items:center;width:100%;padding:12px 14px;border:0;background:none;text-align:left;border-radius:12px}
.trip:hover{background:var(--surface-2)}
.trip .when{font-size:13px;color:var(--muted)}
.trip .when b{display:block;color:var(--ink);font-weight:600}
.trip .path{font-weight:600;overflow-wrap:anywhere}
.trip .path i{font-style:normal;color:var(--muted);padding:0 4px}
.trip .path{display:block}
.trip .why{display:block;margin-top:3px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.trip .amt{text-align:right;font-size:14px}
.trip .amt b{display:block;color:var(--money)}
.trip .amt span{color:var(--muted);font-size:12px}
.daygroup{margin-top:18px}
.dayhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 14px 6px;font-family:var(--display);font-size:15px;font-weight:700}
.dayhead span{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.daycard{padding:4px}
.daycard .trip + .trip{border-top:1px solid var(--line);border-radius:0}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.field{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0;width:100%}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar .search{flex:1 1 240px;width:auto}
.toolbar select{flex:0 0 auto;width:auto;min-width:170px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}
.more{display:block;margin:18px auto 0;padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}

.sumrow{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:16px;color:var(--muted)}
.sumrow b{color:var(--ink);font-family:var(--display);font-size:20px;margin-right:4px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;background:var(--surface-2)}
td.nw{white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn svg{width:18px;height:18px}

#overlay:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(8,16,20,.5);display:flex;justify-content:flex-end;z-index:50;animation:fade .15s}
.sheet{width:min(540px,100%);height:100%;background:var(--surface);overflow:hidden;padding:0;display:flex;flex-direction:column;gap:0;animation:slide .2s ease-out}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px 18px;background:var(--brand);color:var(--brand-ink);border-bottom:4px solid var(--gold)}
.shead small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.shead h2{color:#fff}
.shead .x{background:rgba(255,255,255,.16);color:#fff}
.shead .x:hover{background:rgba(255,255,255,.28)}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.sfoot{padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.sfoot .err{min-height:0}
.sfoot .actions{margin-top:0;padding-top:0}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
.sheet h2{font-size:24px}
.x{width:38px;height:38px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.row{display:grid;gap:12px}
.row.two{grid-template-columns:repeat(2,minmax(0,1fr));align-items:end}
.row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
label.l{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.l .field{color:var(--ink);font-weight:500;font-size:15px}
.up{text-transform:uppercase}
.swaprow{display:flex;justify-content:center;margin:-6px 0}
.swap{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.swap svg{width:16px;height:16px}
.hint{min-height:40px;padding:10px 14px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.hint.good{background:var(--ok-soft);color:var(--ok)}
.hint.new{background:var(--money-soft);color:var(--money)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.sec{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.retbox{display:grid;gap:12px;grid-template-columns:150px minmax(0,1fr)}
.actions{display:flex;gap:10px;margin-top:auto;padding-top:8px}
.actions .primary{flex:1;justify-content:center;padding:14px}
.leg{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.leg.ret{background:var(--surface-2);border-style:dashed}
.leghead{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:16px}
.lh{display:flex;align-items:center;gap:10px}
.legno{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--body);font-size:13px;font-weight:700}
.leg.ret .legno{background:var(--gold);color:#3b0a07;font-size:11px}
.row.four{grid-template-columns:repeat(4,minmax(0,1fr))}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.hint:empty{display:none}
.addstop{justify-content:center;border-style:dashed}
.cf{position:fixed;inset:0;background:rgba(8,16,20,.55);display:grid;place-items:center;padding:16px;z-index:70;animation:fade .15s}
.cfcard{width:min(460px,100%);background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.cfcard h2{font-size:22px}
.cfcard p{margin:0;color:var(--muted)}
.cflist{display:flex;flex-direction:column;gap:6px;font-size:14px;max-height:38vh;overflow:auto;padding:10px 12px;background:var(--surface-2);border-radius:12px}
.cflist div{display:flex;justify-content:space-between;gap:12px}
.cflist span:first-child{overflow-wrap:anywhere}
.cfbtns{display:flex;gap:10px}
.cfbtns .btn{flex:1;justify-content:center;padding:12px}
.nq{display:flex;flex-direction:column;gap:10px}
.nqb{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:14px 56px 14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.nqb b{font-family:var(--display);font-size:16px}
.nqb span{color:var(--muted);font-size:13px}
.nqb kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);min-width:26px;text-align:center;padding:3px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font:600 12px var(--body);color:var(--muted)}
.nqb:hover,.nqb:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
#nq-ret{border-color:var(--accent)}
.cfda{padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:13px}
.cfda.yes{background:var(--money-soft);color:var(--money);font-weight:600}
.darule{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--money-soft);color:var(--money);font-size:14px}
.darule span{flex:1 1 280px}
.setgrid{display:flex;flex-direction:column;gap:20px;max-width:720px}
.setgrid h2{font-size:18px;margin-bottom:6px}
.setp{margin:0 0 14px;color:var(--muted);font-size:14px}
.setfoot{display:flex}
.setfoot .btn{padding:13px 24px}
.tright{display:flex;align-items:center;gap:12px}
.gear{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff}
.gear svg{width:20px;height:20px}
.tscroll{overflow-x:auto;overflow-y:hidden;height:16px;border-bottom:1px solid var(--line)}
.tscroll div{height:1px}
.tscroll::-webkit-scrollbar,.tall::-webkit-scrollbar{height:12px;width:12px}
.tscroll::-webkit-scrollbar-thumb,.tall::-webkit-scrollbar-thumb{background:var(--bar);border-radius:6px;border:2px solid var(--surface-2)}
.tscroll::-webkit-scrollbar-track,.tall::-webkit-scrollbar-track{background:var(--surface-2)}
.tall{max-height:calc(100vh - 340px);min-height:240px;overflow:auto}
.tall thead th{position:sticky;top:0;background:var(--surface);z-index:1;box-shadow:0 1px 0 var(--line)}
.kbd{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.dayname{font-weight:600;color:var(--accent);font-size:12px;margin-left:6px}
.err{color:var(--danger);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  .main{padding:0 16px 120px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin:0 -16px;padding:14px 16px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--brand);color:#fff;z-index:10;border-bottom:3px solid var(--gold)}
  .main>#view{padding-top:16px}
  .topbar .brand{padding:0;font-size:18px}
  .topbar .mark{width:30px;height:30px}
  .topbar .status{margin:0;padding:0;font-size:12px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar .plus span{width:46px;height:46px;margin-top:-18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
  .tabbar .plus{color:var(--accent)}
  .pagehead h1{font-size:26px}
  .pad{padding:16px}
  .hero{grid-template-columns:minmax(0,1fr);gap:20px}
  .bigfare strong{font-size:46px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .scrim{align-items:flex-end}
  .sheet{height:auto;max-height:94%;border-radius:20px 20px 0 0;animation:rise .22s ease-out}
  .shead{padding:16px 16px 14px}
  .sbody{padding:16px}
  .sfoot{padding-inline:16px}
  @keyframes rise{from{transform:translateY(40px);opacity:.6}}
  .toast{bottom:96px}
}
@media (max-width:420px){
  .figs{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .fig b{font-size:20px}
  .trip{grid-template-columns:62px minmax(0,1fr) auto;gap:6px 10px;padding:12px 8px}
  .row.three,.row.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stepper b{min-width:120px}
  .retbox{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.tablewrap,.tall{scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tablewrap::-webkit-scrollbar,.tall::-webkit-scrollbar{display:none}
.tall{max-height:calc(100vh - 300px);min-height:170px;overflow:auto}
.tall table{font-size:12.5px}
.tall th{padding:7px 9px;font-size:10px}
.tall td{padding:6px 9px}
.tall th:first-child,.tall td:first-child{position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:1px 0 0 var(--line)}
.tall thead th:first-child{z-index:3}

function trips(){return S.data.trips}
function months(){if(cache.months)return cache.months;var m={};trips().forEach(function(t){m[mKey(t.d)]=1});return cache.months=Object.keys(m).sort()}
function routeMaps(){
  if(cache.rm)return cache.rm;
  var exact={},hist={};
  S.data.routes.forEach(function(r){var k=(r.from+'|'+r.to).toLowerCase();if(!exact[k])exact[k]=r});
  trips().forEach(function(t){var k=(t.from+'|'+t.to).toLowerCase();var mins=(toMin(t.t2)!=null&&toMin(t.t1)!=null)?Math.max(0,toMin(t.t2)-toMin(t.t1)):0;hist[k]={km:t.km,fare:t.fare,mins:mins}});
  return cache.rm={exact:exact,hist:hist};
}
function lookup(a,b){
  a=(a||'').trim().toLowerCase();b=(b||'').trim().toLowerCase();if(!a||!b)return null;
  var m=routeMaps(),k=a+'|'+b,rk=b+'|'+a;
  if(m.exact[k])return {km:m.exact[k].km,fare:m.exact[k].fare,mins:m.exact[k].mins,src:'route'};
  if(m.exact[rk])return {km:m.exact[rk].km,fare:m.exact[rk].fare,mins:m.exact[rk].mins,src:'route'};
  if(m.hist[k])return {km:m.hist[k].km,fare:m.hist[k].fare,mins:m.hist[k].mins,src:'history'};
  if(m.hist[rk])return {km:m.hist[rk].km,fare:m.hist[rk].fare,mins:m.hist[rk].mins,src:'history'};
  return null;
}
function places(){
  if(cache.places)return cache.places;var c={};
  trips().forEach(function(t){[t.from,t.to].forEach(function(p){if(p)c[p]=(c[p]||0)+1})});
  S.data.routes.forEach(function(r){[r.from,r.to].forEach(function(p){if(p)c[p]=(c[p]||0)+0.01})});
  return cache.places=Object.keys(c).sort(function(a,b){return c[b]-c[a]});
}
function matchPlace(u){
  var ps=places(),up=u.toUpperCase();if(ps.indexOf(up)>=0)return up;
  var a=ps.filter(function(p){return p.indexOf(up)===0});if(a.length)return a[0];
  var b=ps.filter(function(p){return p.indexOf(up)>=0});return b.length?b[0]:null;
}

function dset(){var d=S.data.settings||{};return {amt:d.daAmount!=null?+d.daAmount:625,rate:d.daRate!=null?+d.daRate:(d.daPct!=null?+d.daPct/100:0.7),km:d.daKm!=null?+d.daKm:16}}

  if(cache.da)return cache.da;

  trips().forEach(function(t){(g[t.d]=g[t.d]||[]).push(t)});
  Object.keys(g).forEach(function(d){var a=g[d].slice().sort(sortAsc),km=Math.round(a.reduce(function(x,t){return x+t.km},0)*10)/10;if(km>thr&&v>0){byId[a[a.length-1].id]=v;byDate[d]=v}});

}

  return head+'<title>Travel Diary</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="'+FONTS+'"><style id="css">'+css+'</style><div id="root"></div><div id="overlay"></div><div id="toast-slot"></div><script>window.__DATA__='+json.replace(/</g,'\\u003c')+';<'+'/script><script id="code">'+code+'<'+'/script></body></html>';

async function persist(){
  if(!(window.claude&&window.claude.use)){try{localStorage.setItem('diary-data-friend-v1',JSON.stringify(S.data));savedRev=rev;setStatus(rev===savedRev?'saved':'pending')}catch(e){setStatus('error')}return}
  if(saving){clearTimeout(timer);timer=setTimeout(persist,700);return}
  saving=true;var myRev=rev;setStatus('saving');
  var json=JSON.stringify(S.data);
  try{
    var art=window.claude&&window.claude.use?await window.claude.use('artifact'):null;
    if(!art){var e0=new Error('x');e0.code='not_granted';throw e0}
    try{await art.publish({'data.json':json})}
    catch(e){
      if(e&&(e.code==='capability_disabled'||e.code==='capability_removed'||e.code==='invalid_content')){await art.publish(buildHtml(json))}
      else throw e;
    }
    savedRev=myRev;
    setStatus(rev===savedRev?'saved':'pending');
    if(rev!==savedRev){clearTimeout(timer);timer=setTimeout(persist,500)}
  }catch(e){
    var c=e&&e.code;
    if(c==='conflict'){/* page reloads to the latest version */}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared')setStatus('readonly');
    else setStatus('error');
  }
  saving=false;
}

function niceMax(v){if(v<=0)return 100;var p=Math.pow(10,Math.floor(Math.log10(v)));var c=[1,2,2.5,5,10];for(var i=0;i<c.length;i++)if(c[i]*p>=v)return c[i]*p;return 10*p}
function chart(W,H){
  var keys=[];for(var i=11;i>=0;i--)keys.push(shiftM(S.month,-i));
  var sums={};trips().forEach(function(t){var k=mKey(t.d);sums[k]=(sums[k]||0)+t.fare});var dd=daCalc().byDate;Object.keys(dd).forEach(function(d){var k=mKey(d);sums[k]=(sums[k]||0)+dd[d]});

var repCleanup=null;
function setupReportScroll(){
  if(repCleanup){repCleanup();repCleanup=null}
  var w=$('#twrap');if(!w)return;
  var host=w.closest('.rt');if(!host)return;
  var hbs=$$('.rt-h',host),vb=$('.rt-v',host),chips=$$('.rt-chip',host),jump=[1,7,8,10,13];
  var c1w=function(){var h=w.querySelector('thead th');return h?h.offsetWidth:0};
  function fit(bar,axis,pos,max,view,total){
    var tr=$('.rt-track',bar),th=$('.rt-thumb',bar),tl=axis==='x'?tr.clientWidth:tr.clientHeight;
    var len=Math.max(40,tl*view/total);
    if(axis==='x'){th.style.width=len+'px';th.style.transform='translateX('+(max>0?(tl-len)*pos/max:0)+'px)'}
    else{th.style.height=len+'px';th.style.transform='translateY('+(max>0?(tl-len)*pos/max:0)+'px)'}
    $('[data-dir="-1"]',bar).disabled=pos<=1;$('[data-dir="1"]',bar).disabled=pos>=max-1;
  }
  function upd(){
    var sw=w.scrollWidth,cw=w.clientWidth,sl=w.scrollLeft,sh=w.scrollHeight,ch=w.clientHeight,st=w.scrollTop;
    var vov=sh>ch+1;
    if(vb)vb.hidden=!vov;
    cw=w.clientWidth;sw=w.scrollWidth;
    var hov=sw>cw+1;
    hbs.forEach(function(b){b.hidden=!hov;if(hov)fit(b,'x',sl,sw-cw,cw,sw)});
    if(vb&&vov)fit(vb,'y',st,sh-ch,ch,sh);
    host.style.setProperty('--c1w',c1w()+'px');
    host.style.setProperty('--vw',(vov&&vb?vb.offsetWidth:0)+'px');
    host.classList.toggle('sh-l',hov&&sl>2);
    host.classList.toggle('sh-r',hov&&sl<sw-cw-2);
    var heads=w.querySelectorAll('thead th'),act=0,edge=sl+c1w()+8;
    jump.forEach(function(ci,k){if(heads[ci]&&heads[ci].offsetLeft<=edge)act=k});
    if(hov&&sl>=sw-cw-1)act=jump.length-1;
    chips.forEach(function(c,k){c.classList.toggle('on',k===act)});
  }
  function step(axis,dir,smooth,amt){var o={behavior:smooth?'smooth':'auto'};if(axis==='x')o.left=dir*amt;else o.top=dir*amt;w.scrollBy(o)}
  var holdT=null,hold=null;
  function stopHold(){clearTimeout(holdT);clearInterval(hold);holdT=hold=null}
  function bindArrow(btn,axis){
    var big=function(){return axis==='x'?Math.max(180,w.clientWidth*.6):Math.max(120,w.clientHeight*.6)};
    btn.addEventListener('pointerdown',function(e){
      if(e.button!==0)return;e.preventDefault();stopHold();
      var dir=+btn.getAttribute('data-dir');
      step(axis,dir,true,big());
      holdT=setTimeout(function(){hold=setInterval(function(){step(axis,dir,false,32)},16)},450);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){btn.addEventListener(ev,stopHold)});
    btn.addEventListener('click',function(e){if(e.detail===0)step(axis,+btn.getAttribute('data-dir'),true,big())});
  }
  function bindTrack(bar,axis){
    var tr=$('.rt-track',bar),th=$('.rt-thumb',bar);
    th.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();
      try{th.setPointerCapture(e.pointerId)}catch(x){}
      th.classList.add('drag');
      var p0=axis==='x'?e.clientX:e.clientY,s0=axis==='x'?w.scrollLeft:w.scrollTop;
      function mv(ev){
        var tl=axis==='x'?tr.clientWidth:tr.clientHeight,len=axis==='x'?th.offsetWidth:th.offsetHeight;
        var max=axis==='x'?w.scrollWidth-w.clientWidth:w.scrollHeight-w.clientHeight;
        var v=s0+((axis==='x'?ev.clientX:ev.clientY)-p0)*max/Math.max(1,tl-len);
        if(axis==='x')w.scrollLeft=v;else w.scrollTop=v;
      }
      function up(){th.classList.remove('drag');th.removeEventListener('pointermove',mv);th.removeEventListener('pointerup',up);th.removeEventListener('pointercancel',up)}
      th.addEventListener('pointermove',mv);th.addEventListener('pointerup',up);th.addEventListener('pointercancel',up);
    });
    tr.addEventListener('pointerdown',function(e){
      if(e.target!==tr)return;
      var tb=th.getBoundingClientRect(),before=axis==='x'?e.clientX<tb.left:e.clientY<tb.top;
      step(axis,before?-1:1,true,axis==='x'?w.clientWidth*.8:w.clientHeight*.8);
    });
  }
  hbs.forEach(function(b){$$('.rt-arr',b).forEach(function(a){bindArrow(a,'x')});bindTrack(b,'x')});
  if(vb){$$('.rt-arr',vb).forEach(function(a){bindArrow(a,'y')});bindTrack(vb,'y')}
  chips.forEach(function(c,k){c.addEventListener('click',function(){var h=w.querySelectorAll('thead th')[jump[k]];if(h)w.scrollTo({left:Math.max(0,h.offsetLeft-c1w()-4),behavior:'smooth'})})});
  /* drag the table itself with the mouse */
  var pan=null,moved=false;
  w.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse'||e.button!==0)return;pan={x:e.clientX,y:e.clientY,sl:w.scrollLeft,st:w.scrollTop,id:e.pointerId};moved=false});
  w.addEventListener('pointermove',function(e){
    if(!pan||e.pointerId!==pan.id)return;
    var dx=e.clientX-pan.x,dy=e.clientY-pan.y;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>6){moved=true;w.classList.add('grabbing');try{w.setPointerCapture(e.pointerId)}catch(x){}}
    if(moved){w.scrollLeft=pan.sl-dx;w.scrollTop=pan.st-dy}
  });
  function endPan(){if(!pan)return;pan=null;w.classList.remove('grabbing');setTimeout(function(){moved=false},0)}
  w.addEventListener('pointerup',endPan);w.addEventListener('pointercancel',endPan);
  w.addEventListener('click',function(e){if(moved){e.stopPropagation();e.preventDefault()}},true);
  w.addEventListener('scroll',upd,{passive:true});
  var ro=null;if(typeof ResizeObserver!=='undefined'){ro=new ResizeObserver(upd);ro.observe(w);ro.observe(w.querySelector('table'))}
  window.addEventListener('resize',upd);
  repCleanup=function(){stopHold();if(ro)ro.disconnect();window.removeEventListener('resize',upd)};
  upd();requestAnimationFrame(upd);
}

function numWords(n){
  var a=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'],
      b=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  function two(x){return x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'')}
  function three(x){var h=Math.floor(x/100),r=x%100;return (h?a[h]+' HUNDRED'+(r?' ':''):'')+(r?two(r):'')}
  if(n===0)return 'ZERO';
  var out=[],cr=Math.floor(n/10000000);n%=10000000;var lk=Math.floor(n/100000);n%=100000;var th=Math.floor(n/1000);n%=1000;
  if(cr)out.push(three(cr)+' CRORE');if(lk)out.push(two(lk)+' LAKH');if(th)out.push(two(th)+' THOUSAND');if(n)out.push(three(n));
  return out.join(' ');
}

}

function notesList(){return S.data.notes||(S.data.notes=[])}

function fnHalf(){

function fnRange(){

  t=t.replace(/^\ufeff/,'');var first=t.split(/\r?\n/)[0]||'';var del=first.indexOf('\t')>=0?'\t':(first.split(';').length>first.split(',').length?';':',');

    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===del){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=c}

}

function commit(id){

    return true}

    var i2=+m[1],l2=legObj(i2);if(!l2)return true;

    return true}
  if(m=/^L(\d+)-(from|to)$/.exec(id)){
    if(!v)return false;if(el.readOnly)return true;
    var q=matchPlace(v);el.value=q||v.toUpperCase();

function saveTrip(next){

  if(!date){err.textContent='Type the date like 12/10.';return}

  for(var i=0;i<legs.length;i++){
    var l=legs[i],name=wasEdit?'':(F.ret&&i===F.legs.length?'Back to head quarter: ':'Stop '+(i+1)+': ');
    var from=l.from.trim().toUpperCase(),to=l.to.trim().toUpperCase();
    if(!from||!to){err.textContent=name+'fill in both From and To.';return}
    if((l.t1.trim()&&!parseTime(l.t1))||(l.t2.trim()&&!parseTime(l.t2))){err.textContent=name+'type the time like 09:30 or 17:30.';return}
    recs.push({d:date,t1:parseTime(l.t1)||'',t2:parseTime(l.t2)||'',km:parseFloat(l.km)||0,fare:parseFloat(l.fare)||0,from:from,to:to,why:l.why.trim().toUpperCase(),dur:l.dur});
  }
  if(!F.confirmed){showConfirm(date,recs,next,wasEdit);return}
  var added=0;
  recs.forEach(function(r,i){
    var dur=r.dur;delete r.dur;
    if(wasEdit){r.id=F.id;for(var k=0;k<S.data.trips.length;k++){if(S.data.trips[k].id===F.id){S.data.trips[k]=r;break}}}
    else{r.id=S.data.nextId++;S.data.trips.push(r);added++}
    var m=routeMaps();
    if(!m.exact[(r.from+'|'+r.to).toLowerCase()]&&!m.exact[(r.to+'|'+r.from).toLowerCase()]&&(r.km||r.fare)){
      var row={from:r.from,to:r.to,km:r.km,fare:r.fare,mins:dur>0?dur:0};S.data.routes.push(row);m.exact[(r.from+'|'+r.to).toLowerCase()]=row;
    }
  });
  if(!wasEdit){S.data.hq=(val('f-hq').trim().toUpperCase())||S.data.hq;S.data.retDefault=!!F.ret}

  var p=profile();
  return '<div class="pagehead"><div><h1>Profile</h1><p>Your office and service details, used in the printed report.</p></div></div>'+
   '<form id="pf" class="setgrid" autocomplete="off"><section class="card pad"><h2>Official details</h2><div class="proggrid">'+
   selHTML('pf-est','Name of the establishment',PROF.est,p.est)+
   '<label class="l">Name of the official<input class="field up" id="pf-name" value="'+esc(p.name||'')+'" placeholder="Full name"></label>'+
   '<label class="l">Actual pay (₹)<input class="field num" id="pf-pay" type="number" inputmode="decimal" step="1" min="0" value="'+esc(p.pay||'')+'"></label>'+
   selHTML('pf-des','Designation',PROF.des,p.des)+
   selHTML('pf-work','Working as',PROF.work,p.work)+
   selHTML('pf-sub','Sub division name',PROF.sub,p.sub)+
   '</div></section><div class="setfoot"><button type="submit" class="btn primary">Save profile</button></div></form>';
}
function saveProfile(){
  S.data.profile={est:val('pf-est'),name:val('pf-name').trim().toUpperCase(),pay:val('pf-pay'),des:val('pf-des'),work:val('pf-work'),sub:val('pf-sub')};
  touch();toast('Profile saved');
}
function viewTools(){
  return '<div class="pagehead"><div><h1>Tools</h1><p>Backup, restore and maintain your travel diary data.</p></div></div>'+
   '<section class="tool-card"><div><h3>Save backup</h3><p>Download all trips and routes as a JSON backup file.</p></div><button class="btn primary" data-act="backup">'+ICON.down+'Save backup</button></section>'+
   '<section class="tool-card"><div><h3>Restore from backup</h3><p>Replace the data in this browser with a previously saved backup file.</p></div><button class="btn" data-act="restore">Choose backup file</button><input type="file" id="restorefile" accept=".json,application/json" hidden></section>'+
   '<section class="tool-card"><div><h3>Data location</h3><p>Your diary is stored privately in this browser on this computer.</p></div><span class="report-count">Local browser storage</span></section>';
}
function daPrev(){var a=parseFloat(val('da-amt'))||0,r=parseFloat(val('da-rate'))||0,k=parseFloat(val('da-km'))||0,h=$('#da-prev');if(h)h.textContent='Amount of DA = '+r+' × '+kmf(a)+' = '+money(Math.round(a*r*100)/100)+', paid when a day has more than '+kmf(k)+' km.'}
function saveSettings(){
  var hq=val('set-hq').trim().toUpperCase();if(hq){var m=matchPlace(hq);S.data.hq=m||hq}
  S.data.settings={daAmount:parseFloat(val('da-amt'))||0,daRate:parseFloat(val('da-rate'))||0,daKm:parseFloat(val('da-km'))||0};
  touch();toast('Settings saved');renderRefresh();
}
function saveRoute(){
  var from=$('#r-from').value.trim().toUpperCase(),to=$('#r-to').value.trim().toUpperCase();
  if(!from||!to){$('#r-err').textContent='Please fill in both places.';return}
  var rec={from:from,to:to,km:parseFloat($('#r-km').value)||0,fare:parseFloat($('#r-fare').value)||0,mins:parseInt($('#r-min').value,10)||0};
  if(R.i==null)S.data.routes.push(rec);else S.data.routes[R.i]=rec;
  closeSheet();touch();toast('Route saved');renderRefresh();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('#rep-prev,#rep-next');
  if(b){
    if(b.id==='rep-prev')S.rpage=Math.max(0,S.rpage-1);
    else S.rpage=S.rpage+1;
    renderView();
    return;
  }
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='closeSheet'){if(el.classList.contains('scrim')&&e.target!==el)return;closeSheet();return}
  if(a==='tab'){S.tab=el.getAttribute('data-tab');try{localStorage.setItem('diary-tab',S.tab)}catch(x){}renderRefresh();window.scrollTo(0,0);return}
  if(a==='add'){openTrip(null);return}
  if(a==='edit'){var id=+el.getAttribute('data-id');var t=trips().filter(function(x){return x.id===id})[0];if(t)openTrip(t);return}
  if(a==='pdf'){doPDF();return}
  if(a==='aptxlsx'){doAptXlsx();return}
  if(a==='reqsave'){saveReqId(val('req-id'));return}
  if(a==='dclear'){S.df='';S.dt='';S.dn=150;renderRefresh();return}
  if(a==='savenew'){saveTrip(true);return}
  if(a==='fnpdf'){doFortnightPDF();return}
  if(a==='fnhalf'){S.half=+el.getAttribute('data-h');renderView();return}
  if(a==='marknote'){openNote();return}
  if(a==='ev-add'){openEvent(el.getAttribute('data-k'));return}
  if(a==='ev-edit'){openEvent(el.getAttribute('data-k'),+el.getAttribute('data-id'));return}
  if(a==='hol-year'){S.hy=(S.hy||new Date().getFullYear())+ +el.getAttribute('data-n');renderView();return}
  if(a==='hol-fixed'){addFixedHolidays();return}
  if(a==='skin'){S.data.skin=el.getAttribute('data-k');applySkin();touch();document.querySelectorAll('.skin-dot').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-k')===S.data.skin))});if(S.tab==='home')renderView();return}
  if(a==='fare-chart'){fareChart();return}
  if(a==='route-template'){routeTemplate();return}
  if(a==='route-upload'){$('#routefile').click();return}
  if(a==='rsort'){var k=el.getAttribute('data-k');if(S.rs===k)S.rd=-S.rd;else{S.rs=k;S.rd=1}fillRoutes();return}
  if(a==='fare-go'){S.data.routes.forEach(function(r){r.fare=busFare(r.km)});closeSheet();touch();toast('All route fares updated');renderRefresh();return}
  if(a==='editnote'){openNote(el.getAttribute('data-d'));return}
  if(a==='mprev'){S.month=shiftM(S.month,-1);S.rpage=0;renderView();return}
  if(a==='mnext'){S.month=shiftM(S.month,1);S.rpage=0;renderView();return}
  if(a==='openmonths'){toggleMonthPicker();return}
  if(a==='popyear'){renderMonthPop(+el.getAttribute('data-y'));return}
  if(a==='pickmonth'){S.month=el.getAttribute('data-m');S.rpage=0;closeMonthPicker();renderView();return}
  if(a==='tripdelete'){
    var id=+el.getAttribute('data-id');
    if(el.getAttribute('data-confirm')!=='1'){el.setAttribute('data-confirm','1');el.title='Tap again to delete';el.style.background='var(--danger-soft)';el.style.color='var(--danger)';toast('Tap the dustbin again to delete');return}
    S.data.trips=S.data.trips.filter(function(x){return x.id!==id});touch();toast('Trip deleted');renderRefresh();return}
  if(a==='more'){S.dn+=150;fillDiary();return}
  if(a==='rmore'){S.rn+=300;fillRoutes();return}
  if(a==='retry'){persist();return}
  if(a==='download'){doDownload();return}
  if(a==='backup'){saveFile('Travel-Diary-backup-'+todayStr()+'.json',JSON.stringify(S.data),'application/json');toast('Backup saved');return}
  if(a==='restore'){$('#restorefile').click();return}
  if(a==='dasettings'){S.tab='settings';try{localStorage.setItem('diary-tab',S.tab)}catch(x){}renderRefresh();window.scrollTo(0,0);return}
  if(a==='route-add'){openRoute(null);return}
  if(a==='route-edit'){openRoute(+el.getAttribute('data-i'));return}
  if(a==='addleg'){addLeg();return}
  if(a==='rmleg'){rmLeg(+el.getAttribute('data-i'));return}
  if(a==='why'){var w=$('#L'+(F.cur||0)+'-why')||$('#L0-why');w.value=el.getAttribute('data-w');return}
  if(a==='delete'){
    if(!F.del){F.del=true;el.textContent='Tap again to delete';return}
    S.data.trips=S.data.trips.filter(function(x){return x.id!==F.id});closeSheet();touch();toast('Trip deleted');renderRefresh();return}
  if(a==='rdelete'){
    if(!R.del){R.del=true;el.textContent='Tap again to delete';return}
    S.data.routes.splice(R.i,1);closeSheet();touch();toast('Route deleted');renderRefresh();return}
});
document.addEventListener('input',function(e){
  if(/^L\d+-min$/.test(e.target.id||'')&&F){var mi=+e.target.id.slice(1).split('-')[0],ml=legObj(mi),mn=parseInt(e.target.value,10);if(ml&&!isNaN(mn)&&mn>=0&&mn<=1440){ml.dur=mn;var ms=parseTime(val('L'+mi+'-t1'));if(ms&&mn>0)$('#L'+mi+'-t2').value=fromMin(toMin(ms)+mn)}}
  var tid=e.target.id||'',mk=/^L\d+-km$/.test(tid)?tid.replace('-km','-fare'):(tid==='r-km'?'r-fare':'');
  if(mk){var fe=document.getElementById(mk);if(fe&&!fe.getAttribute('data-manual')){var kv=parseFloat(e.target.value);fe.value=isNaN(kv)||e.target.value===''?'':busFare(kv)}}
  else if(/^L\d+-fare$/.test(tid)||tid==='r-fare'){e.target.setAttribute('data-manual','1')}
  var id=e.target.id;
  if(id==='dq'){S.dq=e.target.value;S.dn=150;fillDiary()}
  else if(id==='rq'){S.rq=e.target.value;S.rn=200;fillRoutes()}
  else if(/^L\d+-(from|to)$/.test(id)&&F&&!e.target.readOnly){updateLeg(+id.slice(1).split('-')[0],true,false)}
  else if(id==='f-ret'){toggleRet(e.target.checked)}
  else if(/^da-/.test(id)){daPrev()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='rep-limit'){S.rl=+e.target.value;S.rpage=0;renderView();return}
  if(e.target.id==='req-id'){saveReqId(e.target.value);return}
  if(e.target.id==='dfrom'||e.target.id==='dto'){if(e.target.id==='dfrom')S.df=e.target.value;else S.dt=e.target.value;S.dm='all';S.dn=150;var dmEl=$('#dm');if(dmEl)dmEl.value='all';var cb=$('[data-act=dclear]');if(cb)cb.hidden=!(S.df||S.dt);fillDiary();return}
  if(e.target.id==='routefile'){var rf=e.target.files[0];if(!rf)return;var rr=new FileReader();rr.onload=function(){uploadRoutes(String(rr.result))};rr.readAsText(rf);e.target.value='';return}
  if(e.target.id==='restorefile'){var f=e.target.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!Array.isArray(d.trips)||!Array.isArray(d.routes))throw 0;S.data=d;if(!S.data.nextId)S.data.nextId=Math.max(0,...d.trips.map(function(t){return t.id||0}))+1;S.month=defaultMonth();touch();renderRefresh();toast('Backup restored')}catch(x){toast('That file is not a diary backup')}};fr.readAsText(f);return}if(e.target.id==='dm'){S.dm=e.target.value;S.dn=150;fillDiary()}});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='tf')saveTrip(false);else if(e.target.id==='rf')saveRoute();else if(e.target.id==='sf')saveSettings();else if(e.target.id==='pf')saveProfile();else if(e.target.id==='nf')saveNote();else if(e.target.id==='ef')saveEvent()});
var lastFocusAt=0;
document.addEventListener('focusin',function(e){var el=e.target;if(F&&el.matches&&el.matches('#tf input.field')&&!el.readOnly){lastFocusAt=Date.now();setTimeout(function(){if(document.activeElement===el&&el.select)try{el.select()}catch(x){}},0)}});
document.addEventListener('mouseup',function(e){if(F&&e.target.matches&&e.target.matches('#tf input.field')&&Date.now()-lastFocusAt<400){e.preventDefault();try{e.target.select()}catch(x){}}});
document.addEventListener('focusin',function(e){var m=F&&/^L(\d+)-/.exec(e.target.id);if(m)F.cur=+m[1]});
document.addEventListener('focusout',function(e){if(F&&/^(f-date|f-hq|L\d+-(t1|min|t2|from|to))$/.test(e.target.id))commit(e.target.id)});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&F){
    var el=e.target;
    if(el&&el.tagName==='INPUT'&&el.type!=='checkbox'&&el.closest('#tf')){
      e.preventDefault();
      if(!commit(el.id))return;
      var nx=nextField(el.id);
      if(nx){var n=$('#'+nx);if(n){n.focus();if(n.select)n.select()}}else afterLast();
      return}
  }
if(e.key==='Escape'){var cf=$('#confirm')||$('#nextq');if(cf){var wasNq=cf.id==='nextq';cf.remove();if(wasNq){var w=$('#L'+(F?F.legs.length-1:0)+'-why');if(w)w.focus()}return}if($('#overlay').firstChild)closeSheet()}});

/* ---------- start ---------- */
async function start(){
  $('#root').innerHTML='<div class="main" style="padding-top:60px"><div class="empty"><b>Opening your diary…</b></div></div>';
  try{
    try{var ls=localStorage.getItem('diary-data-friend-v1');if(ls)S.data=JSON.parse(ls)}catch(e){}
    if(!S.data)S.data=window.__DATA__;
  }catch(e){
    $('#root').innerHTML='<div class="main"><div class="empty"><b>Could not open your diary</b>Please reload the page.</div></div>';return;
  }
  var fixed=false;if(S.data.fareChart!==2){(S.data.routes||[]).forEach(function(r){r.fare=busFare(r.km)});S.data.fareChart=2;fixed=true}
  applySkin();
  S.month=defaultMonth();
  renderRefresh();
  if(fixed){touch();toast('Route fares updated as per bus fare chart')}
  S.canDownload=true;if(S.tab==='report')renderView();
}
start();
})();
</script>
